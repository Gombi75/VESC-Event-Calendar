  button{font:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel)}
  .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:20px}
  .brand h1{font-size:18px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
  .brandline{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 8px}
  .brandline .brandlogo{display:block;width:120px;height:120px}
  .brandsub{font-family:'Audiowide',system-ui,sans-serif;font-weight:400;white-space:nowrap;letter-spacing:0;font-size:18px;line-height:1.15;text-align:center}
  .brand p{text-align:center}
  @media (prefers-color-scheme: dark){ .brandlogo g[fill="#022839"]{fill:#eceef1} }
  .brand p{margin:0;color:var(--muted);font-size:12.5px}
  .btn-primary{background:var(--accent);color:var(--panel);border:0;border-radius:10px;padding:11px 14px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-secondary{background:var(--race-bg);color:var(--ink);border:1.5px solid var(--race);border-radius:10px;padding:9px 14px;font-weight:600;width:100%;margin-top:-12px}
  .btn-secondary:hover{filter:brightness(.97)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed}
  .section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
  .filters{display:flex;flex-direction:column;gap:4px}
  .filter{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;user-select:none}
  .filter:hover{background:var(--soft)}
  .filter input{position:absolute;opacity:0;pointer-events:none}
  .check{width:18px;height:18px;border-radius:5px;border:2px solid var(--c);display:grid;place-items:center;flex:none;transition:background .12s}
  .check svg{width:11px;height:11px;opacity:0}
  .filter input:checked + .check{background:var(--c)}
  .filter input:checked + .check svg{opacity:1}
  .filter input:focus-visible + .check{outline:2px solid var(--c);outline-offset:2px}
  .filter .emoji{font-size:16px}
  .filter .name{flex:1;font-weight:500}
  .filter .count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .filter.off .name,.filter.off .emoji{opacity:.45}
  .filter-actions{display:flex;gap:12px;padding:4px 10px 0}
  .linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px}
  .upcoming{display:flex;flex-direction:column;gap:6px;overflow:auto}
  .up{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--soft);border:0;text-align:left;width:100%}
  .up .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
  .up .t{font-weight:600;font-size:13px;line-height:1.3}
  .up .m{color:var(--muted);font-size:12px;margin-top:2px}
  .empty{color:var(--muted);font-size:12.5px;padding:4px 2px}
  .me{margin-top:10px;font-size:13px}
  .muted{color:var(--muted)}
  .admin-badge{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
  .keybox{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .keyrow{display:flex;gap:6px;align-items:center}
  .keyrow code{flex:1;font-size:11px;word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
  .keyrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px}
  .btn.small{padding:6px 10px;font-size:12.5px}
  .members{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px}
  .mem{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
  .mem:hover{background:var(--soft)}
  .mem.all{border-bottom:1px solid var(--line);border-radius:0;margin-bottom:2px}
  .status{font-size:12px;color:var(--muted);margin-top:auto;line-height:1.4}
  .status.warn{color:#c2410c}

  main{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .toolbar h2{margin:0 8px 0 0;font-size:22px;font-weight:700;letter-spacing:-.01em;min-width:200px}
  .iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;width:36px;height:36px;display:grid;place-items:center}
  .iconbtn:hover{background:var(--soft)}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 14px;height:36px;font-weight:500}
  .pill:hover{background:var(--soft)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
  .seg button{border:0;background:var(--panel);padding:0 14px;height:34px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}

  .cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;flex:1}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
  .dow div{padding:10px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(118px,1fr);flex:1}
  .day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;position:relative}
  .day:nth-child(7n){border-right:0}
  .day:hover{background:var(--soft)}
  .day.other{background:color-mix(in srgb,var(--bg) 60%,transparent)}
  .day.other .num{color:var(--muted);opacity:.6}
  .num{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
  .day.today .num{background:var(--today);color:var(--panel)}
  .ev{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:6px;background:var(--bg-c);color:var(--ink);font-size:12px;border:0;border-left:3px solid var(--c);text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
  .ev:hover{filter:brightness(.97)}
  .ev.race{font-weight:700}
  .chooser{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);text-align:center}
  .choice:hover{filter:brightness(.97)}
  .choice.train{border-color:var(--accent)}
  .choice.race{border-color:var(--race);background:var(--race-bg)}
  .choice .ce{font-size:24px}
  .choice .ct{font-weight:700;font-size:15px}
  .choice .cs{font-size:12px;color:var(--muted)}
  .choice.social{border-color:var(--social);background:var(--social-bg)}
  .chooser{grid-template-columns:repeat(3,1fr)}
  @media (max-width:520px){ .chooser{grid-template-columns:1fr} .choice{flex-direction:row;justify-content:flex-start;text-align:left;padding:12px 14px;gap:12px} .choice .cs{display:none} }
  .btn-social{background:var(--social-bg);color:var(--ink);border:1.5px solid var(--social);border-radius:10px;padding:9px 14px;font-weight:600;width:100%;margin-top:-12px}
  .btn-social:hover{filter:brightness(.97)}
  .pastconfirm{background:#fff4e0;border:1.5px solid #f28c28;border-radius:10px;padding:10px 12px;color:#1b1f24}
  .pastconfirm p{margin:0 0 8px;font-weight:600;font-size:13.5px}
  .pastbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .btn-sub{background:var(--panel);color:var(--ink);border:1.5px dashed var(--line);border-radius:10px;padding:9px 14px;font-weight:600;width:100%;margin-top:-12px}
  .btn-sub:hover{background:var(--soft)}
  .calopts{display:flex;flex-direction:column;gap:8px}
  .calopt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;width:100%}
  .calopt:hover{background:var(--soft)}
  .calopt span{font-size:12px;color:var(--muted)}
  .subsec{border-top:1px solid var(--line);padding-top:10px}
  .keyrow input[readonly]{font-size:11px}
  .list-head{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 18px 2px;font-size:15px;font-weight:700}
  .list-head.toggle{color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:14px;cursor:pointer}
  .list-day.dim,.list-ev.dim{opacity:.6}
  .timehint:empty{display:none}
  .timehint{margin-top:-6px}
  input.bad{border-color:#c0392b !important;background:#fdecec}
  .linkprev{display:block;margin-top:6px;font-size:12.5px;color:var(--swim);word-break:break-all}
  .repeat{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
  .detail a{color:var(--swim)}
  .ev .tm{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
  .ev .tt{overflow:hidden;text-overflow:ellipsis}
  .more{font-size:11.5px;color:var(--muted);background:none;border:0;text-align:left;padding:1px 6px}

  .list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 0}
  .list-day{padding:12px 18px 4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .list-ev{display:flex;gap:14px;align-items:center;padding:10px 18px;border:0;background:none;width:100%;text-align:left}
  .list-ev:hover{background:var(--soft)}
  .list-ev .dot{width:34px;height:34px;border-radius:9px;background:var(--bg-c);display:grid;place-items:center;font-size:17px;flex:none}
  .list-ev .info{flex:1;min-width:0}
  .list-ev .t{font-weight:600}
  .list-ev .m{color:var(--muted);font-size:12.5px;margin-top:2px}
  .list-ev .who{font-size:12px;color:var(--muted);white-space:nowrap}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .scrim.open{display:flex}
  .modal{background:var(--panel);border-radius:16px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
  .modal header h3{margin:0;font-size:17px}
  .modal .body{padding:8px 20px 4px;display:flex;flex-direction:column;gap:12px}
  .modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 18px;flex-wrap:wrap}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--muted)}
  label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;width:100%}
  label.f textarea{resize:vertical;min-height:70px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
  .sportpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sportpick.five{grid-template-columns:repeat(5,1fr)}
  .sportpick.five label{font-size:11px}
  .sportpick label{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:500;display:flex;flex-direction:column;gap:2px;align-items:center}
  .sportpick label span.e{font-size:18px}
  .sportpick input{position:absolute;opacity:0;pointer-events:none}
  .sportpick input:checked + label{border-color:var(--c);background:var(--bg-c)}
  .sportpick input:focus-visible + label{outline:2px solid var(--c);outline-offset:1px}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 14px;font-weight:500}
  .btn:hover{background:var(--soft)}
  .btn.dark{background:var(--accent);color:var(--panel);border-color:var(--accent)}
  .btn.danger{color:#c0392b;border-color:color-mix(in srgb,#c0392b 40%,var(--line))}
  .btn.danger.confirm{background:#c0392b;color:#fff;border-color:#c0392b}
  .spacer{flex:1}
  .detail{display:flex;flex-direction:column;gap:10px;padding:4px 20px 0}
  .detail .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg-c);font-size:12.5px;font-weight:600;align-self:flex-start}
  .detail .line{display:flex;gap:10px;align-items:flex-start;font-size:14px}
  .detail .line .k{width:22px;text-align:center;flex:none;color:var(--muted)}
  .detail .desc{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
  .att{display:flex;flex-wrap:wrap;gap:6px}
  .att span{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12.5px}
  .err{color:#c0392b;font-size:12.5px;min-height:1em}
  .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px 6px}

  .menu-toggle{display:none}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    aside{border-right:0;border-bottom:1px solid var(--line);gap:14px}
    .upcoming-wrap{display:none}
    .status{margin-top:0}
    .filters{flex-direction:row;flex-wrap:wrap}
    .filter{padding:6px 10px;background:var(--soft)}
    .filter .count{display:none}
    main{padding:14px 12px}
    .toolbar h2{font-size:18px;min-width:0;flex:1}
    .grid{grid-auto-rows:minmax(74px,1fr)}
    .ev .tt{display:none}
    .ev{padding:2px 4px;justify-content:center}
    .dow div{padding:8px 4px;text-align:center}
    .seg{margin-left:0}
  }
</style>
</head>

const DOW = ["H","K","Sze","Cs","P","Szo","V"];
const DOW_LONG = ["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];

const state = { events: [], cursor: new Date(), view: "month", enabled: loadFilters(), loaded: false, me: loadName(), email: (store("vesc-email")||"").trim(), key: loadKey(), adminPw: store("vesc-admin")||"", isAdmin: false };
state.cursor.setDate(1);

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function loadFilters(){
  try{ const v = JSON.parse(store("vesc-filters")||"null"); if(v && typeof v==="object") return Object.assign({run:true,bike:true,swim:true,other:true,race:true,social:true}, v); }catch(e){}
  return {run:true,bike:true,swim:true,other:true,race:true,social:true};
}
function saveFilters(){ store("vesc-filters", JSON.stringify(state.enabled)); }
function loadName(){ return (store("vesc-name")||"").trim(); }
function newKey(){ const a=new Uint8Array(20); crypto.getRandomValues(a); return Array.from(a,b=>b.toString(16).padStart(2,"0")).join(""); }
function loadKey(){ let k=(store("vesc-key")||"").trim(); if(!/^[a-f0-9]{32,64}$/.test(k)){ k=newKey(); store("vesc-key",k); } return k; }
const auth = () => ({ key: state.key, adminPw: state.adminPw });
function apply(d){ if(d && d.events){ state.events=d.events; state.isAdmin=!!d.isAdmin; } }

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const todayStr = () => ymd(new Date());
function fmtDayLong(s){ const d=parseYmd(s); return `${d.getFullYear()}. ${MONTHS[d.getMonth()]} ${d.getDate()}., ${DOW_LONG[d.getDay()]}`; }
function fmtDayShort(s){ const d=parseYmd(s); return `${MONTHS[d.getMonth()].slice(0,3)}. ${d.getDate()}. ${DOW_LONG[d.getDay()]}`; }
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v;
    else if(k==="style") e.setAttribute("style",v);
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(v!==false && v!=null) e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k instanceof Node?k:document.createTextNode(String(k))); }
  return e;
}
const sportOf = ev => SPORTS[ev.sport] ? ev.sport : "other";
const visible = () => state.events.filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date) && state.enabled[sportOf(e)]);
const sortEv = (a,b) => (a.date+(a.start||"99:99")).localeCompare(b.date+(b.start||"99:99"));
const lastDay = e => (e.endDate && e.endDate>e.date) ? e.endDate : e.date;
function whenText(e, long){
  const fd = long ? fmtDayLong : fmtDayShort;
  const days = lastDay(e)!==e.date ? fd(e.date)+" – "+fd(lastDay(e)) : fd(e.date);
  const time = e.start ? e.start+(e.end?"–"+e.end:"") : "egész nap";
  return {days, time};
}
const iGo = e => !!state.me && (e.attendees||[]).some(n => n.toLowerCase()===state.me.toLowerCase());

/* ---------- server calls ---------- */
// A naptár háttere (Google Apps Script webalkalmazás /exec címe)
const API_URL = "https://script.google.com/macros/s/AKfycbwdUwBtJQAJghf1j8K0BG6MKMpaAkkbEeJtUr2q5xHTpxuDOU0dzVJhojMqwc9LT5ss1A/exec";
const inAppsScript = typeof google!=="undefined" && google.script && google.script.run;
function call(fn, ...args){
  if(inAppsScript) return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
  });
  // külső weboldalról: sima kérés, Google-bejelentkezés (süti) nélkül
  return fetch(API_URL, { method:"POST", redirect:"follow", credentials:"omit",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) })
    .then(r => { if(!r.ok) throw new Error("A naptár szervere nem érhető el ("+r.status+")."); return r.json(); })
    .then(d => { if(!d || !d.ok) throw new Error((d && d.error) || "Ismeretlen hiba."); return d.result; });
}
async function refresh(){
  try{
    apply(await call("getData", auth())); state.loaded = true;
    setStatus("Élő naptár: mindenki ugyanazt látja. Frissítve: "+new Date().toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    state.loaded = true; setStatus("Nem sikerült betölteni a naptárt. Próbáld újra később.", true);
  }
  renderAll();
}

/* ---------- sidebar ---------- */
function renderMe(){
  const box=document.getElementById("me"); box.textContent="";
  box.append(
    el("span",{},"👤 "),
    state.me ? el("strong",{},state.me) : el("span",{class:"muted"},"Még nem adtad meg a neved"),
    " ",
    el("button",{class:"linkbtn",onclick:()=>askName()}, state.me?"módosít":"megadom"),
    el("div",{style:"margin-top:6px"},
      state.isAdmin ? el("span",{class:"admin-badge"},"🛡️ Rendszergazda") : null, " ",
      el("button",{class:"linkbtn",onclick:()=>state.isAdmin?adminLogout():adminLogin()}, state.isAdmin?"kilépés":"rendszergazda belépés")));
}
function renderFilters(){
  const box=document.getElementById("filters"); box.textContent="";
  const counts={run:0,bike:0,swim:0,other:0,race:0,social:0};
  const t=todayStr();
  state.events.forEach(e=>{ if(lastDay(e)>=t) counts[sportOf(e)]++; });
  for(const [k,s] of Object.entries(SPORTS)){
    const id="f-"+k;
    const input=el("input",{type:"checkbox",id});
    input.checked=!!state.enabled[k];
    input.addEventListener("change",()=>{ state.enabled[k]=input.checked; saveFilters(); renderAll(); });
    box.append(el("label",{class:"filter"+(state.enabled[k]?"":" off"),for:id,style:`--c:${s.c}`},
      input, el("span",{class:"check"}, svgCheck()), el("span",{class:"emoji"},s.emoji),
      el("span",{class:"name"},s.name), el("span",{class:"count"},counts[k]||"")));
  }
}
function svgCheck(){
  const ns="http://www.w3.org/2000/svg";
  const s=document.createElementNS(ns,"svg"); s.setAttribute("viewBox","0 0 12 12");
  const p=document.createElementNS(ns,"path"); p.setAttribute("d","M2 6.5l2.5 2.5L10 3.5"); p.setAttribute("stroke","#fff"); p.setAttribute("stroke-width","2.2"); p.setAttribute("fill","none"); p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-linejoin","round");
  s.append(p); return s;
}
function renderUpcoming(){
  const box=document.getElementById("upcoming"); box.textContent="";
  if(!state.loaded){ box.append(el("div",{class:"empty"},"Betöltés…")); return; }
  const t=todayStr();
  const list=visible().filter(e=>lastDay(e)>=t).sort(sortEv).slice(0,8);
  if(!list.length){ box.append(el("div",{class:"empty"},"Nincs tervezett közös edzés a kiválasztott sportágakban.")); return; }
  list.forEach(e=>{
    const s=SPORTS[sportOf(e)];
    box.append(el("button",{class:"up",style:`--c:${s.c}`,onclick:()=>openDetail(e.id)},
      el("span",{class:"bar"}),
      el("div",{}, el("div",{class:"t"},s.emoji+" "+(e.title||s.name)),
        el("div",{class:"m"},(lastDay(e)!==e.date?fmtDayShort(e.date)+" – "+fmtDayShort(lastDay(e)):fmtDayShort(e.date))+(e.start?" · "+e.start:"")+(e.place?" · "+e.place:"")))));
  });
}

/* ---------- main views ---------- */
function renderTitle(){
  const d=state.cursor;
  document.getElementById("title").textContent = state.view==="month" ? `${d.getFullYear()}. ${MONTHS[d.getMonth()]}` : "Összes esemény";
  document.getElementById("vMonth").setAttribute("aria-pressed",state.view==="month");
  document.getElementById("vList").setAttribute("aria-pressed",state.view==="list");
  ["prev","next","todayBtn"].forEach(id=>document.getElementById(id).style.visibility = state.view==="month"?"visible":"hidden");
}
function renderMonth(){
  const view=document.getElementById("view"); view.textContent="";
  const cal=el("div",{class:"cal"});
  const dow=el("div",{class:"dow"}, DOW.map(d=>el("div",{},d)));
  const grid=el("div",{class:"grid"});
  const first=new Date(state.cursor); const m=first.getMonth();
  const offset=(first.getDay()+6)%7;
  const start=new Date(first); start.setDate(1-offset);
  const last=new Date(first.getFullYear(),m+1,0);
  const totalCells=Math.ceil((offset+last.getDate())/7)*7;
  const byDay={};
  visible().forEach(e=>{
    const end=lastDay(e); let d=e.date, n=0;
    while(d<=end && n<62){ (byDay[d] = byDay[d] || []).push(e); const x=parseYmd(d); x.setDate(x.getDate()+1); d=ymd(x); n++; }
  });
  const t=todayStr();
  const small = matchMedia("(max-width:860px)").matches;
  const maxShow = small ? 3 : 4;
  for(let i=0;i<totalCells;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=ymd(d);
    const evs=(byDay[key]||[]).sort(sortEv);
    const cell=el("div",{class:"day"+(d.getMonth()!==m?" other":"")+(key===t?" today":"")}, el("div",{class:"num"},d.getDate()));
    cell.addEventListener("click",ev=>{ if(ev.target===cell||ev.target.classList.contains("num")) openChooser(key); });
    evs.slice(0, evs.length>maxShow? maxShow-1 : maxShow).forEach(e=>{
      const s=SPORTS[sportOf(e)];
      cell.append(el("button",{class:"ev"+(e.sport==="race"?" race":""),style:`--c:${s.c};--bg-c:${s.bg}`,title:`${s.name}: ${e.title||""} ${e.start||""}`,onclick:(x)=>{x.stopPropagation();openDetail(e.id);}},
        small ? s.emoji : (e.start? el("span",{class:"tm"},e.start):null),
        el("span",{class:"tt"},(small?"":s.emoji+" ")+(e.title||s.name))));
    });
    if(evs.length>maxShow) cell.append(el("button",{class:"more",onclick:(x)=>{x.stopPropagation();openDay(key);}},`+${evs.length-maxShow+1} további`));
    grid.append(cell);
  }
  cal.append(dow,grid); view.append(cal);
}
function renderList(){
  const view=document.getElementById("view"); view.textContent="";
  const t=todayStr();
  // lista nézet: minden esemény, szűrés nélkül, dátum szerint
  const all=state.events.filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date));
  const upcoming=all.filter(e=>lastDay(e)>=t).sort(sortEv);
  const past=all.filter(e=>lastDay(e)<t).sort((a,b)=>sortEv(b,a));
  const box=el("div",{class:"list"});
  if(!state.loaded){ box.append(el("div",{class:"empty",style:"padding:16px 18px"},"Betöltés…")); view.append(box); return; }
  const addRows=(target,list,dim)=>{
    let prevDay="";
    list.forEach(e=>{
      if(e.date!==prevDay){ target.append(el("div",{class:"list-day"+(dim?" dim":"")},fmtDayLong(e.date))); prevDay=e.date; }
      const s=SPORTS[sportOf(e)];
      const n=(e.attendees||[]).length;
      const multi=lastDay(e)!==e.date;
      target.append(el("button",{class:"list-ev"+(dim?" dim":""),style:`--bg-c:${s.bg}`,onclick:()=>openDetail(e.id)},
        el("span",{class:"dot"},s.emoji),
        el("div",{class:"info"}, el("div",{class:"t"},e.title||s.name),
          el("div",{class:"m"},[e.sport==="race"?raceLabel(e):(e.sport==="social"?"Közösségi program":s.name), multi&&("eddig: "+fmtDayShort(lastDay(e))), e.start?(e.start+(e.end?"–"+e.end:"")):"egész nap", e.place, e.distance].filter(Boolean).join(" · "))),
        el("span",{class:"who"}, n? `${n} jön` : "")));
    });
  };
  box.append(el("div",{class:"list-head"},`Közelgő események (${upcoming.length})`));
  if(!upcoming.length) box.append(el("div",{class:"empty",style:"padding:6px 18px 14px"},"Nincs közelgő esemény. Vegyél fel egyet a bal oldali gombokkal!"));
  addRows(box,upcoming,false);
  if(past.length){
    const toggle=el("button",{class:"list-head toggle",type:"button"},`▸ Korábbi események (${past.length})`);
    box.append(toggle);
    const pastWrap=el("div",{style:"display:none"});
    toggle.onclick=()=>{
      const open=pastWrap.style.display==="none";
      pastWrap.style.display=open?"":"none";
      toggle.textContent=(open?"▾":"▸")+` Korábbi események (${past.length})`;
      if(open && !pastWrap.childNodes.length) addRows(pastWrap,past,true);
    };
    box.append(pastWrap);
  }
  view.append(box);
}
function renderAll(){
  renderMe(); renderFilters(); renderUpcoming(); renderTitle();
  state.view==="month" ? renderMonth() : renderList();
}

/* ---------- modal ---------- */
const scrim=document.getElementById("scrim");
function openModal(title, content){
  document.getElementById("mTitle").textContent=title;
  const c=document.getElementById("mContent"); c.textContent=""; c.append(content);
  scrim.classList.add("open");
  const f=c.querySelector("input,select,textarea"); if(f) setTimeout(()=>f.focus(),30);
}
function closeModal(){ scrim.classList.remove("open"); }
document.getElementById("mClose").onclick=closeModal;
scrim.addEventListener("click",e=>{ if(e.target===scrim) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function askName(then){
  const inp=el("input",{maxlength:"40",placeholder:"pl. Gombi",value:state.me||""});
  const inpMail=el("input",{type:"email",maxlength:"120",placeholder:"pl. nev@gmail.com",value:state.email||""});
  const err=el("div",{class:"err"});
  const form=el("form",{},
    el("div",{class:"body"}, el("p",{style:"margin:0;color:var(--muted)"},"A neved látszik majd a szervezőnél és a jelentkezőknél. Ezen az eszközön megjegyzem."),
      el("label",{class:"f"},"Neved",inp),
      el("label",{class:"f"},"E-mail cím (nem kötelező)",inpMail),
      el("p",{class:"muted",style:"margin:-6px 0 0;font-size:12px"},"Ha megadod, értesítünk, ha egy esemény, amire jelentkeztél, időpontot vagy helyszínt változtat, vagy elmarad. A címed senkinek nem látszik."),
      keySection(), err),
    el("footer",{}, el("button",{class:"btn",type:"button",onclick:closeModal},"Mégse"), el("button",{class:"btn dark",type:"submit"},"Mentés")));
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const v=inp.value.replace(/;/g,",").trim();
    const m=inpMail.value.trim();
    if(!v){ err.textContent="Írd be a neved."; return; }
    if(m && !/^[^\s@;,]+@[^\s@;,]+\.[^\s@;,]+$/.test(m)){ err.textContent="Ez nem tűnik érvényes e-mail címnek."; return; }
    const mailChanged = m!==(state.email||"") || v!==(state.me||"");
    state.me=v; store("vesc-name",v); state.email=m; store("vesc-email",m); renderMe();
    if(mailChanged && m){ try{ apply(await call("setMyEmail", v, m, auth())); }catch(_){ } }
    if(then) then(); else closeModal();
  });
  openModal("Hogy hívnak?", form);
}
function keySection(){
  const out=el("div",{class:"keybox"});
  const show=el("code",{},state.key);
  const paste=el("input",{placeholder:"Másik eszközöd kulcsa",maxlength:"64"});
  const msgEl=el("div",{class:"muted",style:"font-size:12px"});
  const copy=el("button",{class:"btn small",type:"button",onclick:async()=>{ try{ await navigator.clipboard.writeText(state.key); msgEl.textContent="Kimásolva."; }catch(e){ msgEl.textContent="Jelöld ki és másold ki kézzel."; } }},"Másolás");
  const use=el("button",{class:"btn small",type:"button",onclick:()=>{ const v=paste.value.trim().toLowerCase(); if(!/^[a-f0-9]{32,64}$/.test(v)){ msgEl.textContent="Ez nem érvényes kulcs."; return; } state.key=v; store("vesc-key",v); show.textContent=v; paste.value=""; msgEl.textContent="Átvéve. Mostantól ezen az eszközön is kezelheted a saját edzéseidet."; refresh(); }},"Átveszem");
  out.append(
    el("p",{class:"section-title",style:"margin:4px 0 4px"},"Saját kulcs"),
    el("p",{class:"muted",style:"margin:0 0 6px;font-size:12.5px"},"Erről ismeri fel a naptár, hogy mely edzéseket te hoztad létre (csak azokat tudod szerkeszteni és törölni). Ha más eszközről is kezelni szeretnéd őket, másold át oda ezt a kulcsot."),
    el("div",{class:"keyrow"},show,copy),
    el("div",{class:"keyrow"},paste,use), msgEl);
  return out;
}
function adminLogin(){
  const inp=el("input",{type:"password",maxlength:"100",autocomplete:"current-password"});
  const err=el("div",{class:"err"});
  const form=el("form",{},
    el("div",{class:"body"}, el("p",{style:"margin:0;color:var(--muted)"},"Rendszergazdaként bármelyik edzést szerkesztheted, törölheted, és meghívót küldhetsz rá."),
      el("label",{class:"f"},"Rendszergazda jelszó",inp), err),
    el("footer",{}, el("button",{class:"btn",type:"button",onclick:closeModal},"Mégse"), el("button",{class:"btn dark",type:"submit"},"Belépés")));
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();
    try{
      const ok=await call("checkAdmin", inp.value);
      if(!ok){ err.textContent="Hibás jelszó."; return; }
      state.adminPw=inp.value; store("vesc-admin",inp.value); closeModal(); refresh();
    }catch(x){ err.textContent=msg(x); }
  });
  openModal("Rendszergazda belépés", form);
}
function adminLogout(){ state.adminPw=""; store("vesc-admin",""); state.isAdmin=false; refresh(); }

function openInvite(e){
  const s=SPORTS[sportOf(e)];
  const list=el("div",{class:"members"},el("div",{class:"empty"},"Tagok betöltése…"));
  const extra=el("textarea",{placeholder:"további e-mail címek, vesszővel elválasztva",style:"min-height:54px"});
  const note=el("textarea",{maxlength:"500",placeholder:"Személyes üzenet (nem kötelező)",style:"min-height:54px"});
  const err=el("div",{class:"err"});
  const send=el("button",{class:"btn dark",type:"submit"},"Meghívó küldése ✉️");
  const form=el("form",{},
    el("div",{class:"body"},
      el("p",{style:"margin:0;color:var(--muted)"},`${s.emoji} ${e.title||s.name} · ${fmtDayShort(e.date)}${e.start?" · "+e.start:""}`),
      el("div",{},el("p",{class:"section-title"},"Tagok"),list),
      el("label",{class:"f"},"Egyéb címzettek",extra),
      el("label",{class:"f"},"Üzenet",note), err),
    el("footer",{}, el("button",{class:"btn",type:"button",onclick:()=>openDetail(e.id)},"Vissza"), send));
  call("listMembers").then(ms=>{
    list.textContent="";
    if(!ms.length){ list.append(el("div",{class:"empty"},"Még nincs tag a „Tagok” lapon. Írj be e-mail címet lent.")); return; }
    list.append(el("label",{class:"mem all"},el("input",{type:"checkbox",onchange:ev=>list.querySelectorAll("input[data-id]").forEach(c=>c.checked=ev.target.checked)}),el("strong",{},"Mindenki")));
    ms.forEach(m=>list.append(el("label",{class:"mem"},el("input",{type:"checkbox","data-id":m.id}),m.name)));
  }).catch(()=>{ list.textContent=""; list.append(el("div",{class:"empty"},"A taglistát nem sikerült betölteni.")); });
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const ids=[...list.querySelectorAll("input[data-id]:checked")].map(c=>Number(c.dataset.id));
    if(!ids.length && !extra.value.trim()){ err.textContent="Válassz legalább egy címzettet."; return; }
    send.disabled=true; send.textContent="Küldés…";
    try{
      const n=await call("sendInvite", e.id, ids, extra.value, note.value, state.me, auth());
      openModal("Meghívó elküldve", el("div",{},el("div",{class:"body"},el("p",{},`✅ A meghívót ${n} címzettnek elküldtük a VESC Triatlon nevében.`)),el("footer",{},el("button",{class:"btn dark",onclick:()=>openDetail(e.id)},"Rendben"))));
    }catch(x){ err.textContent=msg(x); send.disabled=false; send.textContent="Meghívó küldése ✉️"; }
  });
  openModal("Meghívó küldése", form);
}
const needName = fn => state.me ? fn() : askName(fn);

function openDay(key){
  const evs=visible().filter(e=>e.date===key).sort(sortEv);
  const wrap=el("div",{class:"list",style:"border:0"});
  evs.forEach(e=>{ const s=SPORTS[sportOf(e)];
    wrap.append(el("button",{class:"list-ev",style:`--bg-c:${s.bg}`,onclick:()=>openDetail(e.id)},
      el("span",{class:"dot"},s.emoji),
      el("div",{class:"info"},el("div",{class:"t"},e.title||s.name),el("div",{class:"m"},[e.start,e.place].filter(Boolean).join(" · ")))));
  });
  openModal(fmtDayLong(key), el("div",{},wrap, el("footer",{},
    el("button",{class:"btn",onclick:()=>newSocial(key)},"🎉 Program"),
    el("button",{class:"btn",onclick:()=>newRace(key)},"🏆 Verseny"),
    el("button",{class:"btn dark",onclick:()=>openForm(null,key)},"+ Edzés"))));
}

/* ---------- külső naptárak ---------- */
const calPad = n => String(n).padStart(2,"0");
function calTitleOf(e){
  const s=SPORTS[sportOf(e)];
  if(e.sport==="race") return s.emoji+" "+(e.title||"Verseny")+" ("+raceLabel(e)+")";
  if(e.sport==="social") return s.emoji+" "+(e.title||"Közösségi program");
  return s.emoji+" "+s.name+(e.title?": "+e.title:"");
}
function calDetails(e){
  return [e.distance, e.desc, e.link, e.organizer&&("Szervező: "+e.organizer), "VESC naptár: "+location.href.split("#")[0]].filter(Boolean).join("\n\n");
}
// helyi idő (a naptár időzónája: Europe/Budapest)
function calTimes(e){
  const last=lastDay(e);
  if(!e.start){
    const d=parseYmd(last); d.setDate(d.getDate()+1);

function icsText(e){

    "UID:"+e.id+"@vesc-naptar","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"")];
  if(t.allDay) lines.push("DTSTART;VALUE=DATE:"+t.startDay.replace(/-/g,""),"DTEND;VALUE=DATE:"+t.endDayExcl.replace(/-/g,""));

}

    const allDay=iAllDay.checked;
    const endDate=(iEndDate.value && iEndDate.value>iDate.value)?iEndDate.value:"";
    if(iEndDate.value && iEndDate.value<iDate.value){ err.textContent="Az utolsó nap nem lehet az első nap előtt."; return; }
    const tp=timeProblem(); if(tp){ err.textContent=""; checkTimes(); timeHint.scrollIntoView({block:"nearest"}); iEnd.focus(); return; }
    const repeating = !!repField && iRep.checked;
    if(repeating && (!iUntil.value || iUntil.value<=iDate.value)){ err.textContent="Az utolsó alkalom legyen későbbi, mint az első."; return; }
    // múltbéli időpont megerősítése (új eseménynél, vagy ha a dátumot múltba tették)
    const inPast = iDate.value < todayStr();
    const dateChanged = !existing || existing.date !== iDate.value;
    if(inPast && dateChanged && !pastConfirmed){
      err.textContent="";
      pastBox.textContent="";
      pastBox.append(
        el("p",{},"⚠️ Biztosan egy múltbéli időpontra szeretnéd rögzíteni? ("+fmtDayLong(iDate.value)+")"),
        el("div",{class:"pastbtns"},
          el("button",{class:"btn",type:"button",onclick:()=>{ pastBox.style.display="none"; iDate.focus(); }},"Nem, módosítom"),
          el("button",{class:"btn dark",type:"button",onclick:()=>{ pastConfirmed=true; pastBox.style.display="none"; save.click(); }},"Igen, rögzítem")));
      pastBox.style.display="";
      pastBox.scrollIntoView({block:"nearest"});
      return;
    }
    const data={id:existing?existing.id:"",sport,raceType,title:iTitle.value.trim(),date:iDate.value,endDate,start:allDay?"":iStart.value,end:allDay?"":iEnd.value,
      place:iPlace.value.trim(),distance:iDist.value.trim(),desc:iDesc.value.trim(),link:iLink.value.trim(),organizer:state.me,email:state.email};
    save.disabled=true; save.textContent="Mentés…";
    try{
      apply(await call("saveEvent", data, auth(), {repeatUntil: repeating?iUntil.value:"", scope}));
      const d=parseYmd(data.date); state.cursor=new Date(d.getFullYear(),d.getMonth(),1);
      closeModal(); renderAll();
    }catch(x){ err.textContent=msg(x); save.disabled=false; save.textContent=existing?"Mentés":"Hozzáadás"; }
  });
  updateLinkPreview();
  openModal(existing?(isRace?"Verseny szerkesztése":isSocial?"Program szerkesztése":"Edzés szerkesztése"):(isRace?"🏆 Új verseny":isSocial?"🎉 Új közösségi program":"Új közös edzés"), form);
}
function firstEnabled(){ return Object.keys(SPORTS).find(k=>k!=="race"&&k!=="social"&&state.enabled[k])||"run"; }
function msg(x){ const m=(x&&x.message)||""; return m && m.length<120 ? "Hiba: "+m.replace(/^Error:\s*/,"") : "Nem sikerült menteni, próbáld újra."; }
function setStatus(t,warn){ const s=document.getElementById("status"); s.textContent=t; s.classList.toggle("warn",!!warn); }

/* ---------- controls ---------- */
document.getElementById("prev").onclick=()=>{ state.cursor=new Date(state.cursor.getFullYear(),state.cursor.getMonth()-1,1); renderAll(); };
document.getElementById("next").onclick=()=>{ state.cursor=new Date(state.cursor.getFullYear(),state.cursor.getMonth()+1,1); renderAll(); };
document.getElementById("todayBtn").onclick=()=>{ const d=new Date(); state.cursor=new Date(d.getFullYear(),d.getMonth(),1); renderAll(); };
document.getElementById("vMonth").onclick=()=>{ state.view="month"; renderAll(); };
document.getElementById("vList").onclick=()=>{ state.view="list"; renderAll(); };
document.getElementById("allOn").onclick=()=>{ for(const k in SPORTS) state.enabled[k]=true; saveFilters(); renderAll(); };
document.getElementById("allOff").onclick=()=>{ for(const k in SPORTS) state.enabled[k]=false; saveFilters(); renderAll(); };
document.getElementById("addBtn").onclick=()=>openForm(null);
document.getElementById("addRaceBtn").onclick=()=>newRace(null);
document.getElementById("addSocialBtn").onclick=()=>newSocial(null);
document.getElementById("subscribeBtn").onclick=()=>openSubscribe();
let rT; addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(state.view==="month") renderMonth(); },150); });

function fitBrand(){
  const h1=document.querySelector(".brandline"); if(!h1) return;
  const sub=h1.querySelector(".brandsub"); const box=h1.parentElement;
  let fs=18; sub.style.fontSize=fs+"px";
  while(sub.scrollWidth>box.clientWidth && fs>11){ fs-=0.5; sub.style.fontSize=fs+"px"; }
}
fitBrand();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitBrand);
addEventListener("resize",fitBrand);
renderAll();
refresh();
setInterval(()=>{ if(!document.hidden && !scrim.classList.contains("open")) refresh(); }, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
